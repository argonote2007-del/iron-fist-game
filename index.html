<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>IRON FIST · PROJECT ZERO v0.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#080d18;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}#app{position:fixed;inset:0;overflow:hidden;background:#0d1423}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}#select{align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);gap:min(3vh,18px);background:radial-gradient(ellipse at 50% 15%,#324b72,#101828 65%)}h1{font-size:clamp(23px,6vw,44px);margin:0;letter-spacing:.09em;color:#f7c977}#select p{margin:0;color:#b9c6d8;font-size:13px}.choices{display:flex;gap:12px;width:min(94vw,550px);justify-content:center}.choice{flex:1;min-width:0;border:2px solid #4b5a76;background:linear-gradient(#283852,#141e30);border-radius:14px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;gap:8px}.choice.selected{border-color:#ffce75;box-shadow:0 0 22px #ffce7540}.portrait{font-size:clamp(42px,11vw,78px)}.choice small{color:#b7c7dc}.primary{border:0;border-radius:9px;background:#e9b965;color:#161722;padding:12px 28px;font-weight:900}.hint{font-size:11px!important;text-align:center}
#fight{width:100%;height:100%;contain:layout size style;background:linear-gradient(#1a2b47 0%,#475371 67%,#4d4350 68%,#202538 100%);isolation:isolate}#fight:before{content:"";position:absolute;left:43%;top:19%;width:13vmin;height:13vmin;background:#eebd7c;border-radius:50%;opacity:.35;filter:blur(2px)}.hud{position:absolute;z-index:4;top:max(5px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));height:16%;display:grid;grid-template-columns:1fr 64px 1fr;align-items:start;gap:10px}.fighter{font-size:clamp(10px,1.8vw,15px);font-weight:800;text-shadow:0 1px 3px #000}.fighter.right{text-align:right}.bar{height:clamp(9px,2.5vh,18px);background:#222b3a;border:1px solid #a7a6a2;border-radius:4px;overflow:hidden;margin-top:3px}.fill{height:100%;background:linear-gradient(90deg,#b82d4c,#f77b65);width:100%}.right .fill{background:linear-gradient(90deg,#68d8eb,#3379c9)}#timer{font-size:clamp(22px,5vh,40px);text-align:center;color:#ffe1a1;font-weight:900}.arena{position:absolute;inset:0;overflow:hidden}.floor{position:absolute;left:0;right:0;top:67%;height:2px;background:#a6adc0}.person{position:absolute;bottom:33%;width:44px;height:100px;transform-origin:bottom center;transition:left .07s linear;filter:drop-shadow(0 4px 3px #10101c)}.head{position:absolute;left:8px;top:0;width:29px;height:29px;border-radius:50%;background:#e9bd95}.torso{position:absolute;left:5px;top:30px;width:35px;height:43px;border-radius:7px;background:var(--shirt,#d94d5c)}.leg{position:absolute;top:69px;width:12px;height:31px;background:#141c2b;border-radius:5px}.leg.a{left:7px}.leg.b{right:7px}.arm{position:absolute;top:32px;left:-3px;width:12px;height:40px;border-radius:8px;background:#e9bd95;transform:rotate(20deg);transform-origin:top}.arm.b{left:auto;right:-3px;transform:rotate(-20deg)}.person.hit{filter:brightness(2.2)}.person.attack .arm.b{transform:rotate(-85deg)}.person.kick .leg.b{transform:rotate(-75deg);transform-origin:top}.person.guard .arm{transform:rotate(-35deg)}
#message{position:absolute;top:20%;left:0;right:0;text-align:center;color:#ffe09b;font-weight:1000;font-size:clamp(17px,5vh,36px);text-shadow:0 2px 7px #000;pointer-events:none}#log{position:absolute;top:32%;left:0;right:0;text-align:center;font-size:clamp(10px,2.5vh,16px);color:#fff0c7;text-shadow:0 1px 4px #000;pointer-events:none}.controls{position:absolute;z-index:5;bottom:max(7px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:end;gap:14px}.cluster{display:grid;gap:5px}.move{grid-template-columns:repeat(2,clamp(50px,10vw,86px))}.attack-controls{grid-template-columns:repeat(3,clamp(47px,9vw,76px))}.control{height:clamp(42px,12vh,68px);background:#192a44dc;border:1px solid #a0b1d0;border-radius:10px;font-size:clamp(10px,2.3vw,14px);font-weight:800;user-select:none}.control:active,.control.pressed{background:#d3a55d;color:#101321}.utility{position:absolute;right:max(8px,env(safe-area-inset-right));top:20%;z-index:6;display:flex;gap:5px}.utility button{border:1px solid #8494ae;background:#162239c9;border-radius:7px;padding:5px 8px;font-size:11px}#result{display:none;position:absolute;inset:0;z-index:8;background:#070d1dcc;align-items:center;justify-content:center;flex-direction:column;gap:16px}#result.show{display:flex}#resultTitle{font-size:clamp(28px,7vw,55px);font-weight:1000;color:#f3c474}
@media(orientation:portrait){#fight .landscape-tip{display:flex}}.landscape-tip{display:none;position:absolute;z-index:9;inset:0;background:#0e1728ef;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}.landscape-tip strong{font-size:22px}.landscape-tip button{font-size:12px;border:1px solid #8293b0;background:#26354e;padding:9px;border-radius:8px}
@media(max-height:390px){.hud{height:17%}.controls{bottom:4px}.control{height:clamp(38px,12vh,52px)}#message{top:18%}#log{top:30%}}
</style><meta name="theme-color" content="#0d1423"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="IRON FIST"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"></head><body><div id="app">
<section id="select" class="screen active"><h1>IRON FIST</h1><p>PROJECT ZERO · 캐릭터 선택</p><div class="choices"><button class="choice selected" data-fighter="0"><span class="portrait">🥊</span><b>RYU</b><small>균형형 · 펀치 특화</small></button><button class="choice" data-fighter="1"><span class="portrait">🥋</span><b>KAI</b><small>기동형 · 킥 특화</small></button></div><button id="start" class="primary">결투 시작 ⚔</button><p class="hint">아이폰을 가로로 돌려 플레이해 줘 · 두 캐릭터의 차이는 시험용 수치야.</p></section>
<section id="fight" class="screen"><div class="arena" id="arena"><div class="floor"></div><div id="player" class="person"><div class="head"></div><div class="torso"></div><div class="leg a"></div><div class="leg b"></div><div class="arm a"></div><div class="arm b"></div></div><div id="enemy" class="person" style="--shirt:#4386d3"><div class="head"></div><div class="torso"></div><div class="leg a"></div><div class="leg b"></div><div class="arm a"></div><div class="arm b"></div></div></div>
<div class="hud"><div class="fighter"><span id="pname">RYU</span><div class="bar"><div class="fill" id="pbar"></div></div><span id="php">100 HP</span></div><div id="timer">60</div><div class="fighter right">CPU<div class="bar"><div class="fill" id="ebar"></div></div><span id="ehp">100 HP</span></div></div><div id="message">ROUND 1 · FIGHT!</div><div id="log">접근해서 공격하세요</div>
<div class="utility"><button id="fullscreen">⛶ 전체 화면</button><button id="back">선택 화면</button></div>
<div class="controls"><div class="cluster move"><button class="control" data-key="left">◀ 이동</button><button class="control" data-key="right">이동 ▶</button><button class="control" data-key="step">↩ 회피</button><button class="control" data-key="guard">🛡 가드</button></div><div class="cluster attack-controls"><button class="control" data-key="punch">👊 펀치</button><button class="control" data-key="kick">🦵 킥</button><button class="control" data-key="heavy">💥 강타</button><button class="control" data-key="combo">⚡ 콤보</button></div></div>
<div id="result"><div id="resultTitle"></div><button class="primary" id="again">다시 대전</button><button class="primary" id="choose">캐릭터 선택</button></div><div class="landscape-tip"><strong>↻ 아이폰을 가로로 돌려 줘</strong><span>가로 화면에 맞춰 전장과 조작 버튼이 배치돼 있어.</span><button id="rotate">가로 화면 전환 시도</button></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena');const fighters=[{name:'RYU',shirt:'#d94d5c',punch:9,kick:11,speed:.29},{name:'KAI',shirt:'#47b3a6',punch:7,kick:14,speed:.34}];let chosen=0,s=null,keys={},last=performance.now(),raf;let lockedWidth=0,lockedHeight=0;function lockStage(){const f=$('fight');lockedWidth=window.innerWidth;lockedHeight=window.innerHeight;f.style.width=lockedWidth+'px';f.style.height=lockedHeight+'px';}window.addEventListener('orientationchange',()=>setTimeout(lockStage,350));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const dist=()=>Math.abs(s.ex-s.px)*arena.clientWidth;
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));keys={}}
function reset(){s={p:100,e:100,px:.22,ex:.78,guard:false,eg:false,pcd:0,ecd:0,combo:0,time:60,over:false,ai:0};keys={};$('result').classList.remove('show');$('message').textContent='ROUND 1 · FIGHT!';$('log').textContent='접근해서 공격하세요';$('pname').textContent=fighters[chosen].name;$('player').style.setProperty('--shirt',fighters[chosen].shirt);last=performance.now();render()}
function say(t){$('log').textContent=t}function end(t){s.over=true;$('message').textContent=t;$('resultTitle').textContent=t;$('result').classList.add('show')}
function damage(to,n,range,label){if(s.over)return false;if(dist()>range){say(label+' — 사거리 밖');return false}let blocked=to==='e'?s.eg:s.guard,actual=blocked?Math.ceil(n*.2):n;s[to]=Math.max(0,s[to]-actual);let el=$(to==='e'?'enemy':'player');el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),170);say(label+(blocked?' 가드! ':' 적중! ')+actual+' 피해');if(s.e<=0)end('K.O. · YOU WIN');if(s.p<=0)end('K.O. · CPU WINS');return !blocked}
function anim(id,type){let el=$(id);el.classList.add(type);setTimeout(()=>el.classList.remove(type),180)}
function attack(kind){if(!s||s.over||s.pcd>0)return;let f=fighters[chosen],n,range,cd;if(kind==='punch'){n=f.punch;range=88;cd=.35;anim('player','attack')}else if(kind==='kick'){n=f.kick;range=116;cd=.65;anim('player','kick')}else if(kind==='heavy'){n=19;range=85;cd=1.05;anim('player','attack')}else{if(s.combo<=0){say('펀치 적중 직후 콤보를 사용하세요');return}n=15;range=100;cd=.55;anim('player','kick');s.combo=0}let ok=damage('e',n,range,kind.toUpperCase());if(kind==='punch'&&ok)s.combo=.9;s.pcd=cd}
function cpuAttack(){if(s.over||s.ecd>0)return;let k=Math.random()<.65?'펀치':'킥',range=k==='펀치'?85:112,n=k==='펀치'?7:11;s.ecd=k==='펀치'?.6:.85;anim('enemy',k==='펀치'?'attack':'kick');damage('p',n,range,'CPU '+k)}
function render(){if(!s)return;let w=arena.clientWidth;$('player').style.left=(s.px*w-22)+'px';$('enemy').style.left=(s.ex*w-22)+'px';$('player').style.transform=s.px<s.ex?'scaleX(1)':'scaleX(-1)';$('enemy').style.transform=s.ex>s.px?'scaleX(-1)':'scaleX(1)';$('pbar').style.width=s.p+'%';$('ebar').style.width=s.e+'%';$('php').textContent=s.p+' HP';$('ehp').textContent=s.e+' HP';$('timer').textContent=Math.ceil(s.time);$('player').classList.toggle('guard',s.guard);$('enemy').classList.toggle('guard',s.eg)}
function tick(now){let dt=Math.min((now-last)/1000,.05);last=now;if($('fight').classList.contains('active')&&s&&!s.over){s.time=Math.max(0,s.time-dt);s.pcd=Math.max(0,s.pcd-dt);s.ecd=Math.max(0,s.ecd-dt);s.combo=Math.max(0,s.combo-dt);let speed=dt*fighters[chosen].speed;if(keys.left)s.px-=speed;if(keys.right)s.px+=speed;s.px=clamp(s.px,.045,.955);if(Math.abs(s.px-s.ex)<.075)s.px=s.px<s.ex?s.ex-.075:s.ex+.075;s.guard=!!keys.guard;s.ai-=dt;if(s.ai<=0){s.ai=.3+Math.random()*.35;s.eg=dist()<130&&Math.random()<.25;if(dist()<110&&Math.random()<.75)cpuAttack()}if(dist()>85)s.ex+=(s.px>s.ex?1:-1)*dt*.13;else if(dist()<55)s.ex+=(s.px>s.ex?-1:1)*dt*.07;s.ex=clamp(s.ex,.045,.955);if(s.time<=0)end(s.p>s.e?'TIME UP · YOU WIN':s.p<s.e?'TIME UP · CPU WINS':'DRAW')}render();raf=requestAnimationFrame(tick)}
function down(k){if(!s||s.over)return;if(['left','right','guard'].includes(k))keys[k]=true;else if(k==='step'){s.px=clamp(s.px+(s.px<s.ex?-.10:.10),.045,.955);say('백스텝!')}else attack(k)}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.fighter);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))});
$('start').onclick=()=>{lockStage();show('fight');reset()};$('back').onclick=()=>{show('select');$('fight').style.width='100%';$('fight').style.height='100%'};$('choose').onclick=()=>{show('select');$('fight').style.width='100%';$('fight').style.height='100%'};$('again').onclick=reset;
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('pressed');down(k)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('pressed')}))});
const map={ArrowLeft:'left',ArrowRight:'right',z:'punch',x:'kick',c:'heavy',v:'guard',a:'step',s:'combo'};document.addEventListener('keydown',e=>{let k=map[e.key];if(k){e.preventDefault();if(!e.repeat)down(k)}});document.addEventListener('keyup',e=>{let k=map[e.key];if(k)keys[k]=false});window.addEventListener('blur',()=>keys={});
async function landscape(){try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){say('기기 회전을 잠금 해제하고 가로로 돌려 주세요.')}}$('fullscreen').onclick=landscape;$('rotate').onclick=landscape;document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});raf=requestAnimationFrame(tick);
})();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
